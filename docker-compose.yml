services:
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      - db
    networks:
      - app_network
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    volumes:
      - frontend_volume:/app/dist
    networks:
      - app_network

    depends_on:
      - backend
    env_file:
      - frontend/.env

    ports:
      - "80:80"

  db:
    image: postgres
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: prac
      POSTGRES_USER: prac
      POSTGRES_PASSWORD: prac
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/test/prac.init.sql:/docker-entrypoint-initdb.d/prac.init.sql
    env_file:
      - backend/.env
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - app_network

networks:
  app_network:

volumes:
  postgres_data:
    name: postgres_data
    external: false
  pgadmin_data:
    name: pgadmin_data
    external: false
  frontend_volume:
    name: frontend_volume
    external: false